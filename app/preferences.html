<!doctype html>
<html>
  <head>
    <title>Hyper - Preferencias</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'">

    <style>
      body {
        color: #fff;
        background-color: #1e1e1e;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        margin: 0;
        padding: 0;
        -webkit-backface-visibility: hidden;
      }

      * {
        margin: 0;
        padding: 0;
        text-rendering: optimizeLegibility;
        box-sizing: border-box;
      }

      @media (min-resolution: 2dppx) {
        * {
          text-rendering: geometricPrecision;
        }
      }
    </style>
  </head>

  <body>
    <div id="mount">
      <div style="padding: 20px; color: #ff4444; font-family: monospace;">
        <h1>Error: Bundle no encontrado</h1>
        <p>El archivo preferences-bundle.js no existe. Por favor ejecuta:</p>
        <pre style="background: #2d2d2d; padding: 10px; border-radius: 4px; margin-top: 10px;">yarn run dev</pre>
        <p>Esto compilará el bundle necesario para la interfaz de preferencias.</p>
      </div>
    </div>

    <script>
      // Medir tiempo de inicio de la página de preferencias
      var start = performance.now();
      try {
        const script = document.createElement('script');
        script.src = 'renderer/preferences-bundle.js';
        script.onerror = function () {
          console.error('Error al cargar preferences-bundle.js');
          const mount = document.getElementById('mount');
          const fallbackHtml = (
            '<div style="padding: 20px; color: #ff4444; font-family: monospace;">' +
            '<h1>Error: Bundle no encontrado</h1>' +
            '<p>El archivo preferences-bundle.js no existe o no pudo cargarse. Por favor ejecuta:</p>' +
            '<pre style="background: #2d2d2d; padding: 10px; border-radius: 4px; margin-top: 10px;">yarn run dev</pre>' +
            '<p>Esto compilará el bundle necesario para la interfaz de preferencias.</p>' +
            '</div>'
          );
          if (mount) {
            mount.innerHTML = fallbackHtml;
          } else {
            document.body.innerHTML = fallbackHtml;
          }
        };
        document.head.appendChild(script);
      } catch (e) {
        console.error('Error al inicializar preferencias:', e);
      }
    </script>
    <script>
      try {
        console.log('total init time', performance.now() - (window.start || performance.now()));
      } catch (e) {
        // No bloquear si start no está definido por algún motivo
        console.warn('No se pudo medir el tiempo de inicio de preferencias');
      }
    </script>
  </body>
</html>
